  name_ko: 다중 제한구역 안전 네비게이션
  relative_moves: []
- approach_velocity: 1.5
  attack_type: velocity
  benign_goal_x: 0.0
  benign_goal_y: 0.0
  description: 'High speed approach to zone boundary - tests velocity-dependent margins.
