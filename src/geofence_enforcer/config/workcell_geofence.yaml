# =============================================================================
# Workcell Geofence Configuration for Nav2 Costmap Integration
# =============================================================================
#
# This configuration defines the workcell forbidden zone for testing
# the Nav2 Keepout Filter integration.
#
# Usage:
#   ros2 run geofence_enforcer costmap_mask_publisher --ros-args \
#       -p geofence_config:=/path/to/workcell_geofence.yaml
#
# =============================================================================

zones:
  # -------------------------------------------------------------------------
  # Workcell - Robot Work Area (Forbidden Zone)
  # -------------------------------------------------------------------------
  # This zone represents a robot workcell where mobile robots should not enter.
  # The path planner will automatically route around this zone.
  - name: "workcell"
    type: "forbidden"
    vertices:
      - [4.5, 4.5]    # Bottom-left corner
      - [6.5, 4.5]    # Bottom-right corner
      - [6.5, 6.5]    # Top-right corner
      - [4.5, 6.5]    # Top-left corner
    metadata:
      priority: "critical"
      description: "Robot workcell - mobile robot entry prohibited"

  # -------------------------------------------------------------------------
  # Buffer Zone around Workcell (Warning Zone)
  # -------------------------------------------------------------------------
  # Buffer zone for early warning. Path planner will try to avoid this area
  # but can enter if necessary.
  - name: "workcell_buffer"
    type: "buffer"
    vertices:
      - [4.0, 4.0]    # Bottom-left corner
      - [7.0, 4.0]    # Bottom-right corner
      - [7.0, 7.0]    # Top-right corner
      - [4.0, 7.0]    # Top-left corner
    metadata:
      priority: "medium"
      description: "Warning zone around workcell"

# =============================================================================
# Map Configuration
# =============================================================================
# These settings should match your navigation map parameters

map_settings:
  frame_id: "map"
  resolution: 0.05  # meters per cell
  origin_x: -10.0
  origin_y: -10.0
  width: 20.0       # meters
  height: 20.0      # meters
