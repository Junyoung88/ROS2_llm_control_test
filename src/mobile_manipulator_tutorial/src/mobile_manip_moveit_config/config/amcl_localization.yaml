amcl:
  ros__parameters:
    # Motion model noise (differential drive)
    alpha1: 0.1   # rotation noise from rotation
    alpha2: 0.1   # rotation noise from translation
    alpha3: 0.1   # translation noise from translation
    alpha4: 0.1   # translation noise from rotation
    alpha5: 0.1   # translation noise (strafe, not used for diff drive)

    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # Particle filter settings (increased for stability)
    max_particles: 5000
    min_particles: 1000
    pf_err: 0.01
    pf_z: 0.99
    resample_interval: 1

    # Laser model settings
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 3.0
    laser_max_range: 30.0
    laser_min_range: 0.1
    max_beams: 180
    sigma_hit: 0.15
    z_hit: 0.7
    z_rand: 0.3
    z_max: 0.0
    z_short: 0.0

    # Beam skip (disabled for stability)
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    lambda_short: 0.1

    # Recovery (enabled for robustness)
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001

    # Update thresholds (more frequent updates)
    update_min_a: 0.1
    update_min_d: 0.1

    # TF settings
    tf_broadcast: true
    transform_tolerance: 0.5
    save_pose_rate: 0.5

    # Topics
    scan_topic: scan
    map_topic: map

    # Initial pose
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
