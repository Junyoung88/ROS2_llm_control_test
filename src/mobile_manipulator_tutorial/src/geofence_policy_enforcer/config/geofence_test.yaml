# Geofence Test Configuration - Clean Straight Paths
# All zones on y=0 line for obstacle-free navigation
# Robot starts at (0, 0)

uncertainty:
  k_sigma: 3.0
  localization_sigma: 0.15
  tracking_error: 0.05
  v_max: 0.5
  latency: 0.1
  a_max: 2.5                    # DWB decel_lim_x magnitude (m/s²)
  # Computed margin: 3.0*0.15 + 0.05 + 0.5*0.1 + 0.5²/(2*2.5) = 0.60m

# Single forbidden zone for testing
# Zone center at (5, 0), size 2m x 2m
zones:
  - name: "test_zone"
    type: "forbidden"
    priority: 10
    vertices:
      - {x: 4.0, y: -1.0}
      - {x: 6.0, y: -1.0}
      - {x: 6.0, y: 1.0}
      - {x: 4.0, y: 1.0}

  # Safe operating area
  - name: "main_operating_area"
    type: "safe"
    priority: 0
    vertices:
      - {x: -8.0, y: -8.0}
      - {x: 9.0, y: -8.0}
      - {x: 9.0, y: 7.0}
      - {x: -8.0, y: 7.0}
