amcl:
  ros__parameters:
    # Motion model noise (differential drive).
    # Raised 0.1 -> 0.5: a tight motion model over-trusts wheel odometry, which is
    # (a) unrealistic for a drift-prone real robot and (b) anchors AMCL so hard to
    # odom that even a perfectly map-consistent spoofed scan cannot pull the
    # estimate off the true track (the injected pose gets averaged away as lag).
    # Higher odom noise makes AMCL commit to the (attacked) exteroceptive scan —
    # the realistic threat surface — and lets a gradual spoof coherently drag the
    # estimate, while an honest scan still localizes cleanly.
    alpha1: 0.8   # rotation noise from rotation
    alpha2: 0.8   # rotation noise from translation
    alpha3: 0.8   # translation noise from translation
    alpha4: 0.8   # translation noise from rotation
    alpha5: 0.1   # translation noise (strafe, not used for diff drive)

    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # Particle filter settings (increased for stability)
    max_particles: 5000
    min_particles: 1000
    pf_err: 0.01
    pf_z: 0.99
    resample_interval: 1

    # Laser model settings
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 3.0
    laser_max_range: 30.0
    laser_min_range: 0.1
    max_beams: 180
    sigma_hit: 0.15
    # Trust the scan more (lower uniform z_rand) so AMCL commits to the scan —
    # smooth tracking when clean, and a COHERENT mislocalization when a
    # consistently-spoofed scan is injected (reliable lure, not chaotic jitter).
    z_hit: 0.85
    z_rand: 0.15
    z_max: 0.0
    z_short: 0.0

    # Beam skip (disabled for stability)
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    lambda_short: 0.1

    # Recovery DISABLED: random-particle injection was teleporting the clean
    # estimate by up to ~2.5m (false-alarm source for the spoof detector, and it
    # let the clean baseline drift into the zone). With recovery off, AMCL stays
    # committed to the odom+scan track — smooth when honest, coherently pulled
    # when spoofed.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # Update thresholds (more frequent updates)
    update_min_a: 0.1
    update_min_d: 0.1

    # TF settings
    tf_broadcast: true
    transform_tolerance: 0.5
    save_pose_rate: 0.5

    # Topics
    scan_topic: scan
    map_topic: map

    # Initial pose
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
