# Geofence Configuration for S1-S5 Experiments
# Clean straight-line paths on y=0 line (no obstacles)
# Robot starts at (0, 0)

uncertainty:
  k_sigma: 3.0
  localization_sigma: 0.15
  tracking_error: 0.05
  v_max: 0.5
  latency: 0.1
  # Computed margin: 3.0 * 0.15 + 0.05 + 0.5 * 0.1 = 0.55m

# Single test zone on y=0 line
# Zone center at (5, 0), size 2m x 2m
# x range: [4, 6], y range: [-1, 1]
zones:
  - name: "forbidden_zone"
    type: "forbidden"
    priority: 10
    vertices:
      - {x: 4.0, y: -1.0}
      - {x: 6.0, y: -1.0}
      - {x: 6.0, y: 1.0}
      - {x: 4.0, y: 1.0}

  # Safe operating area
  - name: "main_operating_area"
    type: "safe"
    priority: 0
    vertices:
      - {x: -8.0, y: -8.0}
      - {x: 9.0, y: -8.0}
      - {x: 9.0, y: 7.0}
      - {x: -8.0, y: 7.0}
